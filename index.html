<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Request Thick Consol</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b16'/%3E%3Cpath d='M5 24 C12 24 14 8 27 8' fill='none' stroke='%2322e1ff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='5' cy='24' r='3' fill='%2322e1ff'/%3E%3Ccircle cx='27' cy='8' r='3' fill='%23ff3fd8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    color-scheme:dark;
    --bg:#060912;
    --card:rgba(18,24,44,0.72);
    --ink:#eaf0ff;
    --muted:#8a97b8;
    --line:rgba(255,255,255,0.09);
    --field:rgba(255,255,255,0.04);
    --cyan:#22e1ff;
    --violet:#8b5cf6;
    --magenta:#ff3fd8;
    --amber:#ffb347;
    --green:#3dffb0;
    --display:'Bricolage Grotesque', 'Segoe UI', sans-serif;
    --sans:'DM Sans', 'Segoe UI', sans-serif;
    --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  }

  *{box-sizing:border-box;}
  html{ background:var(--bg); }
  body{
    margin:0;
    position:relative;
    min-height:100vh;
    background:
      radial-gradient(700px 420px at 8% -4%, rgba(139,92,246,0.22), transparent 70%),
      radial-gradient(620px 420px at 98% 14%, rgba(255,63,216,0.14), transparent 70%),
      radial-gradient(640px 400px at 60% 0%, rgba(34,225,255,0.10), transparent 70%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
  }
  svg{ display:block; }

  .bg-map{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    opacity:.78;
  }
  .bg-shade{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%, rgba(6,9,18,0.55) 0%, rgba(6,9,18,0) 70%);
  }

  .hero{
    position:relative;
    z-index:1;
    padding:24px 16px 40px;
    overflow:hidden;
  }
  .hero-inner{
    position:relative;
    z-index:2;
    max-width:688px;
    margin:0 auto;
  }
  .hero-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:0 0 40px;
  }
  .brand{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin:0;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--cyan);
    text-shadow:0 0 14px rgba(34,225,255,0.55);
  }
  .brand svg{ flex:0 0 20px; }
  .lang{
    display:inline-flex;
    padding:3px;
    border-radius:999px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--line);
  }
  .lang button{
    cursor:pointer;
    border:none;
    background:transparent;
    color:var(--muted);
    font-family:var(--mono);
    font-weight:600;
    font-size:12px;
    letter-spacing:0.08em;
    padding:6px 14px;
    border-radius:999px;
  }
  .lang button[aria-pressed="true"]{
    color:#06101f;
    background:linear-gradient(90deg, var(--cyan), var(--violet));
    box-shadow:0 0 16px rgba(34,225,255,0.45);
  }
  .lang button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  h1{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(36px, 7.5vw, 62px);
    line-height:1.02;
    letter-spacing:-0.025em;
    margin:0 0 14px;
    color:#fff;
    text-shadow:0 0 34px rgba(139,92,246,0.5);
    text-wrap:balance;
  }
  .lead{
    margin:0;
    max-width:40ch;
    color:#b4bfdc;
    font-size:16px;
    text-shadow:0 1px 14px rgba(4,7,16,0.9);
  }

  .flow{ animation:flow 1.8s linear infinite; }
  @keyframes flow{ to{ stroke-dashoffset:-11; } }
  .pulse{ transform-box:fill-box; transform-origin:center; animation:pulse 2.4s ease-out infinite; }
  @keyframes pulse{ 0%{ transform:scale(1); opacity:.9; } 100%{ transform:scale(3.4); opacity:0; } }

  .only{
    display:flex;
    align-items:flex-start;
    gap:10px;
    max-width:520px;
    margin:18px 0 0;
    font-size:13px;
    line-height:1.5;
    color:var(--muted);
  }
  .only svg{ flex:0 0 18px; margin-top:1px; color:var(--amber); }
  .only b{ color:var(--ink); font-weight:600; }

  .fleet{ margin:22px 0 0; max-width:640px; }
  .fleet-cap{
    margin:0 0 10px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--amber);
  }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 12px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    color:#ffe6bd;
    text-decoration:none;
    background:rgba(255,179,71,0.07);
    border:1px solid rgba(255,179,71,0.35);
    transition:box-shadow .15s, border-color .15s, background .15s;
  }
  .chip .num{
    flex:0 0 18px;
    width:18px;
    height:18px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-family:var(--mono);
    font-size:10.5px;
    font-weight:700;
    color:#06101f;
    box-shadow:0 0 10px currentColor;
  }
  .chip:hover{ border-color:var(--amber); background:rgba(255,179,71,0.14); box-shadow:0 0 18px rgba(255,179,71,0.35); }
  .chip:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  .hero-grid.two{
    display:grid;
    grid-template-columns:minmax(0,1fr) 320px;
    gap:32px;
    align-items:start;
  }
  .inset{
    padding:12px 12px 14px;
    border-radius:18px;
    background:rgba(255,255,255,0.04);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    box-shadow:0 0 30px rgba(139,92,246,0.14);
  }
  .inset-cap{
    margin:2px 4px 8px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--cyan);
  }
  .inset-map{ width:100%; height:auto; border-radius:12px; background:rgba(4,7,16,0.55); }
  .inset-note{ margin:10px 4px 0; font-size:12px; color:var(--muted); }
  @media (max-width:900px){
    .hero-grid.two{ grid-template-columns:1fr; gap:22px; }
    .inset{ max-width:340px; }
  }

  .wrap{
    position:relative;
    z-index:2;
    max-width:720px;
    margin:0 auto;
    padding-left:16px;
    padding-right:16px;
    padding-bottom:56px;
  }

  .steps{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin:0 0 16px;
    padding:0;
    list-style:none;
  }
  .steps li{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
    background:var(--card);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 8px;
    font-size:12.5px;
    font-weight:600;
    line-height:1.25;
  }
  .steps .ic{
    width:38px;
    height:38px;
    border-radius:12px;
    color:var(--cyan);
    background:rgba(34,225,255,0.09);
    border:1px solid rgba(34,225,255,0.3);
    box-shadow:0 0 18px rgba(34,225,255,0.22);
    display:grid;
    place-items:center;
  }
  .steps li:nth-child(2) .ic{ color:var(--violet); background:rgba(139,92,246,0.1); border-color:rgba(139,92,246,0.35); box-shadow:0 0 18px rgba(139,92,246,0.26); }
  .steps li:nth-child(3) .ic{ color:var(--magenta); background:rgba(255,63,216,0.09); border-color:rgba(255,63,216,0.33); box-shadow:0 0 18px rgba(255,63,216,0.24); }
  @media (max-width:420px){ .steps li{ font-size:11.5px; padding:12px 6px; } }

  .card{
    background:var(--card);
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px;
    box-shadow:0 30px 60px -34px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .card + .card{ margin-top:18px; }
  @media (max-width:420px){ .card{ padding:20px; } }

  .sec-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--display);
    font-weight:700;
    font-size:19px;
    margin:0 0 18px;
    letter-spacing:-0.01em;
  }
  .sec-title svg{ color:var(--cyan); filter:drop-shadow(0 0 6px rgba(34,225,255,0.6)); }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.full{ grid-column:1 / -1; }
  .lbl{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .inp{ position:relative; }
  .inp svg{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    pointer-events:none;
  }
  input[type="text"]{
    font-family:var(--mono);
    font-size:15px;
    color:var(--ink);
    background:var(--field);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 14px 13px 44px;
    width:100%;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input[type="text"]::placeholder{ color:var(--muted); opacity:.5; }
  input[type="text"]:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(34,225,255,0.16), 0 0 22px rgba(34,225,255,0.2);
  }
  input.bad{ border-color:#ff5d7a; box-shadow:0 0 0 3px rgba(255,93,122,0.14); }

  .choice{ display:grid; grid-template-columns:1fr; gap:12px; }
  .opt{ position:relative; }
  .opt input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; cursor:pointer; }
  .opt .tile{
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid var(--line);
    background:var(--field);
    border-radius:14px;
    padding:14px;
    transition:all .15s;
  }
  .opt .mark{
    flex:0 0 40px;
    width:40px; height:40px; border-radius:12px;
    display:grid; place-items:center;
    background:rgba(255,255,255,0.06); color:var(--muted);
  }
  .opt .txt{ font-weight:600; line-height:1.2; }
  .opt .txt small{ display:block; font-weight:400; color:var(--muted); font-size:12.5px; margin-top:2px; }
  .opt input:checked + .tile.y{ border-color:var(--green); background:rgba(61,255,176,0.07); box-shadow:0 0 24px rgba(61,255,176,0.2); }
  .opt input:checked + .tile.y .mark{ background:var(--green); color:#04140d; box-shadow:0 0 16px rgba(61,255,176,0.6); }
  .opt input:focus-visible + .tile{ outline:2px solid var(--cyan); outline-offset:2px; }

  .drop{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    border:1.5px dashed rgba(255,255,255,0.18);
    background:var(--field);
    border-radius:14px;
    padding:16px;
    transition:all .15s;
  }
  .drop:hover{ border-color:var(--violet); box-shadow:0 0 22px rgba(139,92,246,0.2); }
  .drop.has{ border-style:solid; border-color:var(--cyan); background:rgba(34,225,255,0.06); }
  .drop input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
  .drop svg{ flex:0 0 28px; color:var(--violet); }
  .drop .name{ min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .drop .name small{ display:block; font-weight:400; color:var(--muted); font-size:12.5px; white-space:normal; }
  .drop.has .name{ font-family:var(--mono); font-size:14px; }
  .note{ margin:8px 0 0; font-size:12.5px; color:var(--muted); }
  .note b{ color:var(--amber); font-weight:600; }

  .mail{
    background:rgba(4,7,16,0.7);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
  }
  .mail-head{
    margin:0;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    display:grid;
    grid-template-columns:auto 1fr;
    gap:6px 14px;
    font-family:var(--mono);
    font-size:13px;
  }
  .mail-head dt{ color:var(--muted); }
  .mail-head dd{ margin:0; word-break:break-word; }
  .mail-head dd.subj{ color:var(--cyan); font-weight:600; text-shadow:0 0 12px rgba(34,225,255,0.4); }
  .mail-body{
    margin:0;
    padding:16px 18px 20px;
    font-family:var(--mono);
    font-size:13px;
    line-height:1.75;
    color:#c9d3ee;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .go{
    margin-top:20px;
    width:100%;
    border:none;
    cursor:pointer;
    color:#06101f;
    background:linear-gradient(90deg, var(--cyan), var(--violet) 55%, var(--magenta));
    font-family:var(--display);
    font-weight:800;
    font-size:17px;
    padding:16px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    box-shadow:0 0 28px rgba(139,92,246,0.5), 0 14px 30px -14px rgba(255,63,216,0.55);
    transition:transform .12s, filter .12s;
  }
  .go:hover{ filter:brightness(1.1); transform:translateY(-1px); }
  .go:active{ transform:translateY(0); }
  .go:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
  .err{
    display:none;
    margin:14px 0 0;
    padding:10px 14px;
    border-radius:10px;
    background:rgba(255,93,122,0.12);
    border:1px solid rgba(255,93,122,0.35);
    color:#ffb3c1;
    font-size:13.5px;
  }
  .err.show{ display:block; }
  .hint{ margin:12px 0 0; text-align:center; font-size:12.5px; color:var(--muted); }
  .hint b{ color:var(--ink); font-weight:600; }

  .alt{ margin-top:22px; padding-top:20px; border-top:1px dashed rgba(255,255,255,0.14); }
  .alt-title{ margin:0 0 12px; font-weight:600; font-size:13.5px; }
  .alt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .alt-btn{
    cursor:pointer;
    background:var(--field);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    font-family:var(--sans);
    font-weight:600;
    font-size:13.5px;
    transition:border-color .15s, box-shadow .15s;
  }
  .alt-btn:hover{ border-color:var(--violet); box-shadow:0 0 18px rgba(139,92,246,0.25); }
  .alt-btn.wide{ grid-column:1 / -1; }
  .alt-btn.done{ border-color:var(--green); background:rgba(61,255,176,0.08); }
  .alt-btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  .alt-note{ margin:10px 0 0; font-size:12.5px; color:var(--muted); }
  @media (max-width:420px){ .alt-grid{ grid-template-columns:1fr; } }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
    .flow, .pulse{ animation:none; }
  }
</style>
</head>

<main class="wrap">
  <ol class="steps">
    <li>
      <span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></span>

    <li>

      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>

          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/></svg>
          <input type="text" id="mbl" data-i18n-ph="phMbl" autocomplete="off">

          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l2 3h14l2-3z"/><path d="M6 17v-6h12v6M9 11V7h6v4M12 3v4"/></svg>

      <div class="field full">

        <div class="choice">

            <span class="tile y">
              <span class="mark"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
              <span class="txt"><span data-i18n="yes"></span><small data-i18n="yesSub"></small></span>

      <div class="field full">
        <label class="lbl" for="response-file" data-i18n="lblFile"></label>

          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l9-9a3.7 3.7 0 015.2 5.2l-9 9a1.8 1.8 0 01-2.6-2.6l8.3-8.3"/></svg>

          <input type="file" id="response-file" accept=".pdf,.jpg,.jpeg,.png">

  <section class="card">
    <h2 class="sec-title">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 11l7 3 3 7z"/><path d="M10 14L21 3"/></svg>
      <span data-i18n="sec2"></span>
    </h2>
    <div class="mail">
      <dl class="mail-head">
        <dt>To</dt><dd>documentation@sinokor.co.id</dd>
        <dt>Subject</dt><dd class="subj" id="p-subj"></dd>
      </dl>
      <pre class="mail-body" id="p-body"></pre>
    </div>
    <p class="err" id="err" data-i18n="err"></p>
    <button class="go" id="go" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <span data-i18n="go"></span>
    </button>
    <p class="hint" data-i18n="hint"></p>

    <div class="alt">
      <p class="alt-title" data-i18n="altTitle"></p>
      <div class="alt-grid">
        <button class="alt-btn" id="open-gmail" type="button" data-i18n="gmail"></button>
        <button class="alt-btn" id="open-outlook" type="button" data-i18n="outlook"></button>
        <button class="alt-btn" id="copy-to" type="button" data-i18n="copyTo"></button>
        <button class="alt-btn" id="copy-subj" type="button" data-i18n="copySubj"></button>
        <button class="alt-btn wide" id="copy-body" type="button" data-i18n="copyBody"></button>
      </div>
      <p class="alt-note" data-i18n="altNote"></p>
    </div>
  </section>
</main>

<script>
(function(){
  var DEST = 'documentation@sinokor.co.id';

  var T = {
    id: {
      lead: 'Kirim permohonan thick cukup dengan tiga data. Subject email terisi otomatis.',
      fleetCap: 'Kapal layanan PCI2',
      insetCap: 'Posisi kapal PCI2 · contoh',
      insetNote: 'Posisi di peta hanya contoh ilustrasi, bukan posisi sebenarnya. Untuk posisi terkini, klik nama kapal.',
      only: '<b>Khusus untuk pemohon thick.</b> Jika Anda tidak membutuhkan thick, tidak perlu mengisi form ini atau mengirim email apa pun.',
      step1: 'Isi data', step2: 'Buka di email', step3: 'Lampirkan & kirim',
      sec1: 'Data permohonan',
      lblMbl: 'No. MBL', lblVessel: 'Nama Kapal & Voyage',
      phMbl: 'mis. MBLJKT2609170123', phVessel: 'mis. KM SINAR JAYA V.112',
      lblThick: 'Permohonan Thick',
      yes: 'Y – Ya', yesSub: 'Mohon di-thick (centang untuk mengajukan)',
      lblFile: 'Response sementara Bea Cukai (opsional)',
      fileEmpty: 'Pilih file response<small>PDF, JPG, atau PNG</small>',
      note: '<b>Catatan:</b> lampiran tidak bisa disisipkan otomatis oleh tautan email. Setelah draft terbuka, lampirkan file ini secara manual sebelum mengirim.',
      sec2: 'Pratinjau email',
      err: 'Lengkapi No. MBL, Nama Kapal & Voyage, dan centang permohonan Thick terlebih dahulu.',
      go: 'Buka di Email',
      hint: 'Draft dibuka di aplikasi email Anda dan <b>belum terkirim</b> sampai Anda menekan Kirim.',
      altTitle: 'Email tidak terbuka? Gunakan cara lain',
      gmail: 'Buka di Gmail', outlook: 'Buka di Outlook web',
      copyTo: 'Salin alamat tujuan', copySubj: 'Salin subject', copyBody: 'Salin isi email',
      altNote: 'Setelah disalin, tempel (paste) ke email baru dari akun email Anda.',
      copied: 'Tersalin ✓', copyFail: 'Gagal, salin manual',
      pMbl: '[No. MBL]', pVessel: '[Nama Kapal & Voyage]', pThick: '[Y]',
      tYes: 'Y - Ya',
      bIntro: 'Mohon proses permintaan thick consol berikut:',
      bMbl: 'No. MBL', bVessel: 'Nama Kapal & Voyage', bThick: 'Permohonan Thick', bAttach: 'Lampiran',
      bAttachNote: '(response sementara Bea Cukai - mohon dilampirkan manual pada email ini)',
      bThanks: 'Terima kasih.'
    },
    en: {
      lead: 'Send your thick request with just three details. The email subject fills in automatically.',
      fleetCap: 'PCI2 service vessels',
      insetCap: 'PCI2 vessel positions · example',
      insetNote: 'Positions on the map are an illustrative example, not actual positions. For current positions, tap the vessel name.',
      only: '<b>For thick requests only.</b> If you do not need thick, there is no need to fill in this form or send any email.',
      step1: 'Fill in details', step2: 'Open in email', step3: 'Attach & send',
      sec1: 'Request details',
      lblMbl: 'MBL No.', lblVessel: 'Vessel Name & Voyage',
      phMbl: 'e.g. MBLJKT2609170123', phVessel: 'e.g. KM SINAR JAYA V.112',
      lblThick: 'Thick Request',
      yes: 'Y – Yes', yesSub: 'Please thick this (tick to submit)',
      lblFile: 'Customs temporary response (optional)',
      fileEmpty: 'Choose response file<small>PDF, JPG, or PNG</small>',
      note: '<b>Note:</b> email links cannot attach files automatically. After the draft opens, attach this file manually before sending.',
      sec2: 'Email preview',
      err: 'Please fill in the MBL No., Vessel Name & Voyage, and tick the Thick request first.',
      go: 'Open in Email',
      hint: 'The draft opens in your email app and is <b>not sent</b> until you press Send.',
      altTitle: 'Email did not open? Try another way',
      gmail: 'Open in Gmail', outlook: 'Open in Outlook web',
      copyTo: 'Copy recipient address', copySubj: 'Copy subject', copyBody: 'Copy email body',
      altNote: 'After copying, paste into a new email from your own email account.',
      copied: 'Copied ✓', copyFail: 'Failed, copy manually',
      pMbl: '[MBL No.]', pVessel: '[Vessel Name & Voyage]', pThick: '[Y]',
      tYes: 'Y - Yes',
      bIntro: 'Kindly process the following thick consol request:',
      bMbl: 'MBL No.', bVessel: 'Vessel & Voyage', bThick: 'Thick Request', bAttach: 'Attachment',
      bAttachNote: '(customs temporary response - please attach it manually to this email)',
      bThanks: 'Thank you.'
    }
  };

  var lang = 'id';
  try { var saved = localStorage.getItem('thick-lang'); if(saved === 'en' || saved === 'id') lang = saved; } catch(e) {}

  var mbl = document.getElementById('mbl');
  var vessel = document.getElementById('vessel');
  var fileInput = document.getElementById('response-file');
  var drop = document.getElementById('drop');
  var fname = document.getElementById('fname');
  var pSubj = document.getElementById('p-subj');
  var pBody = document.getElementById('p-body');
  var err = document.getElementById('err');
  var btnId = document.getElementById('lang-id');
  var btnEn = document.getElementById('lang-en');

  function t(key){ return T[lang][key]; }
  function hasFile(){ return fileInput.files && fileInput.files.length; }
  function thick(){
    var c = document.querySelector('input[name="thick"]:checked');
    return c ? c.value : '';
  }
  function pad(s){ while(s.length < 18) s += ' '; return s; }

  function build(){
    var m = mbl.value.trim() || t('pMbl');
    var v = vessel.value.trim() || t('pVessel');
    var th = thick();
    var tText = th === 'Y' ? t('tYes') : t('pThick');
    var lines = [
      'Dear Sinokor Doc Exp Team,',
      '',
      t('bIntro'),
      '',
      pad(t('bMbl')) + ': ' + m,
      pad(t('bVessel')) + ': ' + v,
      pad(t('bThick')) + ': ' + tText,
      ''
    ];
    if(hasFile()){
      lines.push(pad(t('bAttach')) + ': ' + fileInput.files[0].name + ' ' + t('bAttachNote'));
      lines.push('');
    }
    lines.push(t('bThanks'));
    return {
      subject: 'REQUEST THICK CONSOL - ' + v + ' - ' + m,
      body: lines.join('\n')
    };
  }

  function refresh(){
    var e = build();
    pSubj.textContent = e.subject;
    pBody.textContent = e.body;
  }

  function showFile(){
    if(hasFile()){
      fname.textContent = fileInput.files[0].name;
      drop.classList.add('has');
    } else {
      fname.innerHTML = t('fileEmpty');
      drop.classList.remove('has');
    }
  }

  function applyLang(){
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(el){
      el.innerHTML = t(el.getAttribute('data-i18n'));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-ph]'), function(el){
      el.placeholder = t(el.getAttribute('data-i18n-ph'));
    });
    btnId.setAttribute('aria-pressed', lang === 'id' ? 'true' : 'false');
    btnEn.setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
    showFile();
    refresh();
  }

  function setLang(l){
    lang = l;
    try { localStorage.setItem('thick-lang', l); } catch(e) {}
    applyLang();
  }
  btnId.addEventListener('click', function(){ setLang('id'); });
  btnEn.addEventListener('click', function(){ setLang('en'); });

  [mbl, vessel].forEach(function(el){ el.addEventListener('input', refresh); });
  Array.prototype.forEach.call(document.querySelectorAll('input[name="thick"]'), function(r){
    r.addEventListener('change', refresh);
  });
  fileInput.addEventListener('change', function(){ showFile(); refresh(); });

  function validated(){
    var ok = mbl.value.trim() && vessel.value.trim() && thick();
    mbl.classList.toggle('bad', !mbl.value.trim());
    vessel.classList.toggle('bad', !vessel.value.trim());
    if(!ok){ err.classList.add('show'); return null; }
    err.classList.remove('show');
    return build();
  }

  function flash(btn, text){
    btn.textContent = text;
    btn.classList.add('done');
    setTimeout(function(){
      btn.classList.remove('done');
      btn.textContent = t(btn.getAttribute('data-i18n'));
    }, 1800);
  }

  function copyText(text, btn){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
      flash(btn, ok ? t('copied') : t('copyFail'));
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ flash(btn, t('copied')); }, fallback);
    } else {
      fallback();
    }
  }

  document.getElementById('go').addEventListener('click', function(){
    var e = validated();
    if(!e) return;
    window.location.href = 'mailto:' + encodeURIComponent(DEST) +
      '?subject=' + encodeURIComponent(e.subject) +
      '&body=' + encodeURIComponent(e.body);
  });

  document.getElementById('open-gmail').addEventListener('click', function(){
    var e = validated();
    if(!e) return;
    window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(DEST) +
      '&su=' + encodeURIComponent(e.subject) +
      '&body=' + encodeURIComponent(e.body), '_blank', 'noopener');
  });

  document.getElementById('open-outlook').addEventListener('click', function(){
    var e = validated();
    if(!e) return;
    window.open('https://outlook.office.com/mail/deeplink/compose?to=' + encodeURIComponent(DEST) +
      '&subject=' + encodeURIComponent(e.subject) +
      '&body=' + encodeURIComponent(e.body), '_blank', 'noopener');
  });

  document.getElementById('copy-to').addEventListener('click', function(){ copyText(DEST, this); });
  document.getElementById('copy-subj').addEventListener('click', function(){
    var e = validated();
    if(e) copyText(e.subject, this);
  });
  document.getElementById('copy-body').addEventListener('click', function(){
    var e = validated();
    if(e) copyText(e.body, this);
  });

  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    Array.prototype.forEach.call(document.querySelectorAll('svg.route'), function(s){ if(s.pauseAnimations) s.pauseAnimations(); });
  }

  var bgMap = document.querySelector('svg.bg-map');
  function fitMap(){
    if(bgMap) bgMap.setAttribute('preserveAspectRatio', window.innerWidth < 760 ? 'xMaxYMid slice' : 'xMidYMid slice');
  }
  fitMap();
  window.addEventListener('resize', fitMap);

  applyLang();
})();
</script>
